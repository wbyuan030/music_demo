name: Upstream sync (yt-dlp)

# 每日检测上游 yt-dlp 是否有新 commit；有则用 LLM agent 分析/翻译/测试，
# 自动开 PR（永不 auto-merge）。另有 nightly smoke job 跑真实网络测试。

on:
  schedule:
    - cron: "17 3 * * *"      # 每日 03:17 UTC
  workflow_dispatch:          # 手动触发
    inputs:
      base_branch:
        description: "PR 目标分支"
        required: false
        default: master
        type: string

concurrency:
  group: upstream-sync
  cancel-in-progress: true

permissions:
  contents: write              # bot 提交 + 推分支
  pull-requests: write         # 开 PR + label
  issues: write                # nightly smoke 失败开 issue

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_new: ${{ steps.detect.outputs.has_new }}
      sha: ${{ steps.detect.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream for new commits
        id: detect
        run: |
          LAST=$(python3 -c "import json; print(json.load(open('.sync/upstream-state.json')).get('last_sha',''))" 2>/dev/null || true)
          HEAD=$(git ls-remote https://github.com/yt-dlp/yt-dlp.git refs/heads/master | awk '{print $1}')
          echo "last=$LAST"
          echo "head=$HEAD"
          # 写入 GITHUB_OUTPUT
          {
            echo "has_new=$([ -z "$LAST" ] || [ "$LAST" != "$HEAD" ] && echo true || echo false)"
            echo "sha=$HEAD"
          } >> "$GITHUB_OUTPUT"
      - name: Report no-op
        if: steps.detect.outputs.has_new == 'false'
        run: echo "上游无新 commit，跳过同步"

  sync:
    needs: detect
    if: needs.detect.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    environment: agnes_llm   # 读取该环境的 secrets（LLM_API_KEY 等）
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要 git 历史做 diff 判断

      - name: Clone upstream yt-dlp (read-only reference)
        # partial clone：完整 commit/tree 历史（git log last..HEAD 可用），
        # blob 按需拉取（git show <sha> 时自动从远端取）——agent 需要 git 记录，
        # 但不需要整仓文件。--depth 1 会缺历史导致 analyze 的 git log 失败。
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/yt-dlp/yt-dlp.git _upstream
          git -C _upstream fetch origin master --filter=blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install system deps (cargo test 需要)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: L2 语义分析 (analyze)
        run: python tools/sync/agent.py analyze --upstream _upstream --fetch

      - name: L3 翻译 (translate)
        run: python tools/sync/agent.py translate --upstream _upstream

      - name: L5 修复循环 (fix)
        run: python tools/sync/agent.py fix --max-rounds 3
        id: fix
        # fix 失败 = 翻译产物测试未全绿；下面用 FIX_STATUS 控制是否提交
        continue-on-error: true

      - name: L6 报告 (report)
        run: python tools/sync/agent.py report

      - name: 检查测试门禁
        id: gate
        run: |
          # 测试全绿才算翻译完成；红则回退翻译产物（保留锁+report）
          if cargo test --manifest-path src-tauri/Cargo.toml --lib --quiet 2>/dev/null; then
            echo "status=green" >> "$GITHUB_OUTPUT"
            # 翻译被接受：推进基线锁（下次 detect 不会重跑这批 commit）
            python3 -c "import json,os,datetime; p='.sync/upstream-state.json'; st=json.load(open(p)) if os.path.exists(p) else {}; st['last_sha']='${{ needs.detect.outputs.sha }}'; st['last_date']=datetime.date.today().isoformat(); json.dump(st, open(p, 'w'), indent=2)"
          else
            echo "status=red" >> "$GITHUB_OUTPUT"
            # 回退 src 改动（只保留 .sync/ 与 tools/ 的锁和报告）
            git checkout -- src-tauri/src/ 2>/dev/null || true
            echo "::warning::测试未全绿，翻译产物已回退，PR 仅含基线更新+报告"
          fi

      - name: 更新基线锁 + 提交（只提交 .sync/ 到 master）
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "upstream-sync[bot]@users.noreply.github.com"
          git add .sync/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无基线改动"
          else
            git commit -m "chore(upstream): sync yt-dlp ${{ needs.detect.outputs.sha }} [bot]"
            git push origin master
            echo "已推送基线到 master"
          fi

      - name: 开 PR（翻译产物走分支，永不直推 master）
        if: success() || failure()   # fix 失败也开（draft 标注）
        env:
          BASE_BRANCH: ${{ github.event.inputs.base_branch || 'master' }}
        run: |
          # 先看工作区是否有翻译产物（translate/fix 改的 src）
          if git diff --quiet -- src-tauri/src/; then
            echo "无翻译产物，不开 PR"
          else
            BRANCH="upstream-sync-$(date +%F-%H%M)"
            BASE="${BASE_BRANCH:-master}"
            git checkout -b "$BRANCH"
            git add src-tauri/src/
            git commit -m "chore(upstream): translate ${{ needs.detect.outputs.sha }} [bot]"
            git push -u origin "$BRANCH"
            if [ -f .sync/report.md ]; then
              gh pr create \
                --base "$BASE" \
                --head "$BRANCH" \
                --title "chore(upstream): sync yt-dlp → $(date +%F)" \
                --body-file .sync/report.md \
                --label upstream-sync 2>/dev/null || echo "PR 已存在或创建失败"
            else
              gh pr create \
                --base "$BASE" \
                --head "$BRANCH" \
                --title "chore(upstream): sync yt-dlp → $(date +%F)" \
                --body "自动同步 PR（无 report，详见 Actions 日志）" \
                --label upstream-sync 2>/dev/null || echo "PR 已存在或创建失败"
            fi
          fi

  nightly-smoke:
    # 真实流量轨：跑 #[ignore] 的网络 smoke 测试（夜间）。
    # 独立 job，不阻塞 PR；失败转 issue 提醒人工。
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - name: Run real-site smoke tests
        id: smoke
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --ignored
        continue-on-error: true
      - name: Open issue on smoke failure
        if: always() && steps.smoke.outcome == 'failure'
        run: |
          gh issue create \
            --title "nightly smoke 失败：真实站点连通性异常" \
            --body "夜间真实网络 smoke 测试失败，请检查：
            - 站点协议是否变化（录新 fixture：tools/sync/record_fixture.py）
            - 反爬/限流
            - 我们的 extractor 是否需要同步上游改动（跑 tools/sync/agent.py analyze）
            详见 Actions 日志。" \
            --label upstream-sync 2>/dev/null || echo "issue 创建失败"
